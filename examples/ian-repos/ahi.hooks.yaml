# Exact-entry allowlist for the local Rust hooks, in the rule grammar shared
# with ahi.tools.yaml. The entry string must match the config; `args` are not
# part of the match. CARGO_HOME, RUSTUP_HOME, and RUSTUP_TOOLCHAIN are passed
# through by default. ahi does not install a toolchain. Add other location
# names under toolchain_env, globally or per rule.
version: 1
default: deny
rules:
  - id: rust-linting
    action: hook
    match: {id: rust-linting, entry: cargo fmt --all --}
    effect: approve
  - id: rust-clippy
    action: hook
    match: {id: rust-clippy, entry: cargo clippy --all-targets --all-features -- -Dclippy::all}
    effect: approve
  - id: rust-clippy-warnings
    action: hook
    match: {id: rust-clippy, entry: cargo clippy --all-targets --all-features -- -D warnings}
    effect: approve
