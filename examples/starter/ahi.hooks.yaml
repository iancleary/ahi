# Approves the local Rust hooks by hook id and the exact entry string.
# `args` are not part of the match. A different entry does not run.
# An approve rule without match.entry is a parse error: an id alone never authorizes a command.
# CARGO_HOME, RUSTUP_HOME, and RUSTUP_TOOLCHAIN pass through by default.
# toolchain_env adds other location names. Names only. Credential names are an error.
# Not enabled unless listed: GOROOT, GOPATH, VIRTUAL_ENV, NVM_DIR.
version: 1
default: deny
rules:
  - id: rust-linting
    action: hook
    match: {id: rust-linting, entry: cargo fmt --all --}
    effect: approve
  - id: rust-clippy
    action: hook
    match: {id: rust-clippy, entry: cargo clippy --all-targets --all-features -- -Dclippy::all}
    effect: approve
  # Alternate spelling used by some of Ian's repos. Keep the one the config uses.
  - id: rust-clippy-warnings
    action: hook
    match: {id: rust-clippy, entry: cargo clippy --all-targets --all-features -- -D warnings}
    effect: approve
