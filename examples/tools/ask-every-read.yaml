# Every read, listing, find, and search shows an approval prompt in chat.
version: 1
default: deny
rules:
  - id: ask-list
    action: tool_call
    match: {tool: list_dir}
    effect: approve
    ask: true
  - id: ask-read
    action: tool_call
    match: {tool: read_file}
    effect: approve
    ask: true
  - id: ask-find
    action: tool_call
    match: {tool: find_files}
    effect: approve
    ask: true
  - id: ask-search
    action: tool_call
    match: {tool: search_files}
    effect: approve
    ask: true
