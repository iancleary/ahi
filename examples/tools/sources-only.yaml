# List anywhere; read, find, and search only under src and docs. Deny rules
# win over approvals. The .env and target denies are root paths.
version: 1
default: deny
rules:
  - id: no-env
    action: tool_call
    match: {tool: read_file, path: .env}
    effect: deny
  - id: no-build-output
    action: tool_call
    match: {tool: read_file, path: target}
    effect: deny
  - id: list-tree
    action: tool_call
    match: {tool: list_dir}
    effect: approve
  - id: read-sources
    action: tool_call
    match: {tool: read_file, path: src}
    effect: approve
  - id: read-docs
    action: tool_call
    match: {tool: read_file, path: docs}
    effect: approve
  - id: find-sources
    action: tool_call
    match: {tool: find_files, path: src}
    effect: approve
  - id: find-docs
    action: tool_call
    match: {tool: find_files, path: docs}
    effect: approve
  - id: search-sources
    action: tool_call
    match: {tool: search_files, path: src}
    effect: approve
  - id: search-docs
    action: tool_call
    match: {tool: search_files, path: docs}
    effect: approve
