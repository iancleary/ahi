# ahi-local policy. Upstream pre-commit ignores this file.
# Deny by default: only these exact id + entry pairs are trusted to run.
# The pin must match the hook's `entry` string exactly; args are not part
# of the pin. Credential-like env names are a parse error.
version: 1
repo_allow: []
runtime_allow: []
trusted_system_hooks:
  - id: cargo-clippy
    entry: cargo clippy --all-targets --all-features -- -D warnings
  - id: cargo-test
    entry: cargo test --all-features
network_hooks: []
toolchain_env: []
