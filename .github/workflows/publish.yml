name: publish

# The only workflow that can read CARGO_REGISTRY_TOKEN.
#
# Triggers: a published GitHub Release, and nothing else. Branch pushes,
# pull requests, and pull_request_target do not run this file, so a pull
# request cannot publish and cannot read the token from this workflow.
# Forks do not receive the upstream secret. The publish job also refuses
# every repository other than iancleary/ahi, and it refuses a release whose
# ref is not a tag.
on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  # Pin CI to an exact recent stable: a committed rust-toolchain.toml
  # (channel = "stable") would otherwise float with rustup's resolution.
  # RUSTUP_TOOLCHAIN outranks the file. Bump this and the install steps
  # deliberately when adopting a new stable.
  RUSTUP_TOOLCHAIN: "1.99.1"

permissions:
  contents: read

jobs:
  ci:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is deferred while hosted ARM64 capacity is unavailable.
        # See docs/macos-update-follow-up.md before restoring it.
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: rust toolchain
        # Runners ship rustup preinstalled; no third-party action installs Rust.
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

      - name: Check documentation
        # PowerShell on Windows does not accept the bash `VAR=value command` form.
        run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Verify package
        run: cargo package

      - name: Build project
        run: cargo build --release

  publish:
    needs: ci
    if: github.event_name == 'release' && github.event.action == 'published' && startsWith(github.ref, 'refs/tags/') && github.repository == 'iancleary/ahi'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: rust toolchain
        # Runners ship rustup preinstalled; no third-party action installs Rust.
        # The publish job does not need clippy or rustfmt.
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: verify MSRV floor
        # rust-version = "1.88" in Cargo.toml is a promise to downstream
        # users. Ordinary CI builds a pinned recent stable, so this is the
        # one place the declared floor is exercised: immediately before it
        # is published. The explicit +toolchain override outranks the
        # RUSTUP_TOOLCHAIN env var set above.
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 check --all-features --locked

      - name: Publish to crates.io
        # The token is mapped only in this step, only in this job, and only
        # after the job condition has matched a tag release in iancleary/ahi.
        # The ci job above does not receive the token.
        run: cargo publish --verbose
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
