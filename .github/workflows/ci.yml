name: CI

# Pushes to main, and pull requests targeting main or the stacked spec
# branch. Tag pushes do not match `branches`, so this file never runs
# because a tag was pushed. This workflow does not request
# CARGO_REGISTRY_TOKEN and does not publish.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "cursor/spec-050d"]

env:
  CARGO_TERM_COLOR: always
  # Pin CI to an exact recent stable: a committed rust-toolchain.toml
  # (channel = "stable") would otherwise float with rustup's resolution.
  # RUSTUP_TOOLCHAIN outranks the file. Bump this and the install step
  # deliberately when adopting a new stable.
  RUSTUP_TOOLCHAIN: "1.99.1"

# Fork pull requests receive no repository secrets. This file does not use
# pull_request_target, which would run in the base repository and could see secrets.
permissions:
  contents: read

jobs:
  ci:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is deferred while hosted ARM64 capacity is unavailable.
        # See docs/macos-update-follow-up.md before restoring it.
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: rust toolchain
        # Runners ship rustup preinstalled (macOS 15: 1.29.0, Ubuntu 24.04:
        # 1.29.2, Windows 2025: 1.29.2). No third-party action installs Rust.
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features --locked

      - name: Check documentation
        # PowerShell on Windows does not accept the bash `VAR=value command` form.
        run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Verify package
        # Local crate metadata check. This does not publish and does not use a registry token.
        # --workspace packages ahi-win32 alongside ahi; a plain `cargo package`
        # would look for the path dependency on crates.io and fail.
        run: cargo package --workspace

      - name: Build project
        run: cargo build --release --locked

      - name: cargo-deny and cargo-audit
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/install-supply-chain-tools.sh && cargo deny check && cargo audit

      - name: version smoke
        shell: bash
        run: bash scripts/smoke-version.sh
