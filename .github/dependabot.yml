# Weekly, grouped, manual merge. Exact pins (`=x.y.z`) in Cargo.toml are
# updated in place along with Cargo.lock. Security updates arrive alone so
# they are not held behind the weekly batch. Every PR still passes the
# `--locked` build, cargo-deny, and cargo-audit before a human merges it;
# none of those sees a malicious release of a trusted crate, so the merge
# stays manual.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-and-patch:
        update-types: ["minor", "patch"]
      cargo-major:
        update-types: ["major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(actions)"
    groups:
      actions:
        patterns: ["*"]
