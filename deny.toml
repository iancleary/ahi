# cargo-deny 0.17. Vulnerabilities are denied by default in the advisories check.
# Unlicensed crates are denied because they are not in the allow list.

[advisories]
version = 2
yanked = "deny"
# Unsound and unmaintained advisories fail the build unless listed below with
# a reason, so a new one is a decision, not a warning that scrolls by.
unsound = "all"
unmaintained = "all"
ignore = [
    { id = "RUSTSEC-2026-0253", reason = "lru 0.16 is a non-optional dependency of ratatui-core 0.1 (ratatui 0.30), used only by its layout cache, which ahi does not enable (default-features = false). The unsound path is a panic inside LruCache::pop; ahi never calls it. Clear when ratatui depends on lru 0.18 or later. Reviewed 2026-11-07." },
    { id = "RUSTSEC-2024-0449", reason = "serde_yaml 0.9.34 is the typed YAML parser the config loader already uses. yaml-rust2 rejects aliases, anchors, and duplicate keys before serde_yaml parses a config. This advisory is unmaintained, not a vulnerability. Replacing the parser is separate work." },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
