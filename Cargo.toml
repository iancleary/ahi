[package]
name = "ahi"
description = "Offline pre-commit runner, terminal chat, and development container launcher. Builtin checks and approved local hooks run from .pre-commit-config.yaml and ahi.hooks.yaml; chat tools (read, search, edit, write, run) are gated by ahi.tools.yaml; ahi dev opens the project in a container."
keywords = ["pre-commit", "git-hooks", "tui", "chat", "openai"]
categories = ["development-tools", "command-line-utilities"]
version = "0.12.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"
repository = "https://github.com/iancleary/ahi"
authors = ["Ian Cleary"]
readme = "README.md"

[workspace]
members = [".", "crates/ahi-widgets", "crates/ahi-win32"]

[lib]
name = "ahi"
path = "src/lib.rs"

[[bin]]
name = "ahi"
path = "src/main.rs"

# Exact pins. Caret ranges resolve to releases whose MSRV is above 1.88.
[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
crossterm = "=0.29.0"
flate2 = "=1.1.10"
getrandom = "=0.4.3"
quick-xml = "=0.42.0"
# 0.30.0 is the release that no longer depends on the unmaintained paste crate.
# The ratatui facade and widget set are not used: ahi depends on the core and
# the crossterm backend, and draws with the six widgets forked into
# crates/ahi-widgets (MIT; see its FORK.md).
ratatui-core = { version = "=0.1.2", default-features = false, features = ["std", "underline-color"] }
ratatui-crossterm = { version = "=0.1.2", default-features = false, features = ["crossterm_0_29", "underline-color"] }
ahi-widgets = { path = "crates/ahi-widgets", version = "=0.1.0" }
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
sha2 = "=0.11.1"
tar = "=0.4.46"
toml = "=1.2.0"
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.3"
ureq = { version = "=3.5.1", default-features = false, features = ["rustls"] }
yaml-rust2 = "=0.13.0"

# In-repo Win32 clipboard; the only crate in the workspace with unsafe code.
[target.'cfg(windows)'.dependencies]
ahi-win32 = { path = "crates/ahi-win32", version = "=0.1.0" }


[dev-dependencies]
proptest = "=1.12.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
