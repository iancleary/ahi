[package]
name = "ahi"
description = "Fail-closed pre-commit runner. Reads .pre-commit-config.yaml and runs offline builtin checks."
version = "0.5.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"
repository = "https://github.com/iancleary/ahi"
authors = ["Ian Cleary"]
readme = "README.md"

[workspace]
members = [".", "crates/ahi-win32"]

[lib]
name = "ahi"
path = "src/lib.rs"

[[bin]]
name = "ahi"
path = "src/main.rs"

# Exact pins. Caret ranges resolve to releases whose MSRV is above 1.88.
[dependencies]
base64 = "=0.22.1"
clap = { version = "=4.5.23", features = ["derive"] }
crossterm = "=0.29.0"
flate2 = "=1.1.10"
getrandom = "=0.2.16"
quick-xml = "=0.41.0"
# 0.30.0 is the release that no longer depends on the unmaintained paste crate.
ratatui = "=0.30.0"
regex = "=1.11.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.134", features = ["preserve_order"] }
serde_yaml = "=0.9.34"
sha2 = "=0.10.8"
tar = "=0.4.46"
thiserror = "=1.0.69"
time = { version = "=0.3.55", features = ["formatting", "parsing"] }
toml = "=0.8.23"
unicode-segmentation = "=1.12.0"
unicode-width = "=0.2.0"
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }
yaml-rust2 = "=0.10.0"

# In-repo Win32 clipboard; the only crate in the workspace with unsafe code.
[target.'cfg(windows)'.dependencies]
ahi-win32 = { path = "crates/ahi-win32", version = "=0.1.0" }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.169"

[dev-dependencies]
proptest = "=1.6.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
